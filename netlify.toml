[build]
  publish = "public"
  # Chỉ deploy (tốn credit) khi trang web thay đổi; sửa Apps Script hay tài liệu thì bỏ qua
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ netlify.toml"

[[redirects]]
  from = "/"
  to = "/lovestory/"
  status = 302

# Link riêng của dâu rể: /lovestory/<mã> → trang form (file có thật như admin/, style.css vẫn được ưu tiên)
[[redirects]]
  from = "/lovestory/*"
  to = "/lovestory/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/lovestory/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[build]
  publish = "public"

[[redirects]]
  from = "/"
  to = "/lovestory/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/lovestory/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

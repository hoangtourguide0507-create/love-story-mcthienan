<!DOCTYPE html>
<html lang="vi" data-lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị · Love Story · Thiên Ân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="topbar__inner">
      <span class="wordmark">Thiên Ân <small>Love Story · Quản trị</small></span>
      <button type="button" id="logoutBtn" class="link-btn" hidden>Đăng xuất</button>
    </div>
  </header>

  <div id="demoBanner" class="demo-banner" hidden>
    Chế độ xem thử — chưa kết nối Apps Script. Mật khẩu xem thử: <b>demo</b>. Dữ liệu chỉ lưu trên trình duyệt này.
  </div>

  <main id="view" class="admin-main"><div class="loading"><span></span></div></main>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" id="modalPanel"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="../config.js"></script>
  <script src="../api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
